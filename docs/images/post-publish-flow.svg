<svg width="980" height="430" viewBox="0 0 980 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Post publish flow</title>
  <desc id="desc">Admin uploads markdown, backend renders HTML and TOC, repository stores data in MySQL.</desc>
  <rect width="980" height="430" fill="#e7f2ff"/>
  <text x="490" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2d3c4e">Post Upload and Render Flow</text>

  <g font-family="Arial, sans-serif" fill="#2d3c4e">
    <rect x="48" y="118" width="150" height="94" rx="10" fill="#ffffff" stroke="#7fa5d3" stroke-width="3"/>
    <text x="123" y="153" text-anchor="middle" font-size="17" font-weight="700">Admin Modal</text>
    <text x="123" y="181" text-anchor="middle" font-size="13">meta + .md file</text>

    <rect x="252" y="118" width="150" height="94" rx="10" fill="#ffffff" stroke="#7fa5d3" stroke-width="3"/>
    <text x="327" y="153" text-anchor="middle" font-size="17" font-weight="700">PostApi</text>
    <text x="327" y="181" text-anchor="middle" font-size="13">FormData request</text>

    <rect x="456" y="118" width="150" height="94" rx="10" fill="#ffffff" stroke="#7fa5d3" stroke-width="3"/>
    <text x="531" y="153" text-anchor="middle" font-size="17" font-weight="700">Controller</text>
    <text x="531" y="181" text-anchor="middle" font-size="13">validate input</text>

    <rect x="660" y="118" width="150" height="94" rx="10" fill="#ffffff" stroke="#7fa5d3" stroke-width="3"/>
    <text x="735" y="153" text-anchor="middle" font-size="17" font-weight="700">Markdown</text>
    <text x="735" y="181" text-anchor="middle" font-size="13">HTML + TOC</text>

    <rect x="412" y="280" width="170" height="94" rx="10" fill="#ffffff" stroke="#7fa5d3" stroke-width="3"/>
    <text x="497" y="315" text-anchor="middle" font-size="17" font-weight="700">Repository</text>
    <text x="497" y="343" text-anchor="middle" font-size="13">transaction write</text>

    <rect x="670" y="280" width="170" height="94" rx="10" fill="#ffffff" stroke="#7fa5d3" stroke-width="3"/>
    <text x="755" y="315" text-anchor="middle" font-size="17" font-weight="700">MySQL</text>
    <text x="755" y="343" text-anchor="middle" font-size="13">posts + tags</text>
  </g>

  <line x1="198" y1="165" x2="252" y2="165" stroke="#2d3c4e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="402" y1="165" x2="456" y2="165" stroke="#2d3c4e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="606" y1="165" x2="660" y2="165" stroke="#2d3c4e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M735 212 C735 250, 560 242, 525 280" fill="none" stroke="#2d3c4e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="582" y1="327" x2="670" y2="327" stroke="#2d3c4e" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2d3c4e"/>
    </marker>
  </defs>
</svg>
