<svg width="980" height="420" viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JWT authentication flow</title>
  <desc id="desc">The frontend logs in, backend sets an HTTP-only cookie, and protected APIs verify JWT and token version.</desc>
  <rect width="980" height="420" fill="#e7f2ff"/>
  <text x="490" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2d3c4e">JWT Authentication Flow</text>

  <g font-family="Arial, sans-serif" fill="#2d3c4e">
    <rect x="60" y="118" width="180" height="86" rx="10" fill="#ffffff" stroke="#7fa5d3" stroke-width="3"/>
    <text x="150" y="152" text-anchor="middle" font-size="17" font-weight="700">Login Page</text>
    <text x="150" y="178" text-anchor="middle" font-size="13">username + password</text>

    <rect x="310" y="118" width="180" height="86" rx="10" fill="#ffffff" stroke="#7fa5d3" stroke-width="3"/>
    <text x="400" y="152" text-anchor="middle" font-size="17" font-weight="700">AuthController</text>
    <text x="400" y="178" text-anchor="middle" font-size="13">password_verify</text>

    <rect x="560" y="118" width="180" height="86" rx="10" fill="#ffffff" stroke="#7fa5d3" stroke-width="3"/>
    <text x="650" y="152" text-anchor="middle" font-size="17" font-weight="700">JWT Service</text>
    <text x="650" y="178" text-anchor="middle" font-size="13">set HttpOnly cookie</text>

    <rect x="750" y="280" width="170" height="86" rx="10" fill="#ffffff" stroke="#7fa5d3" stroke-width="3"/>
    <text x="835" y="314" text-anchor="middle" font-size="17" font-weight="700">User Table</text>
    <text x="835" y="340" text-anchor="middle" font-size="13">token_version</text>

    <rect x="310" y="280" width="180" height="86" rx="10" fill="#ffffff" stroke="#7fa5d3" stroke-width="3"/>
    <text x="400" y="314" text-anchor="middle" font-size="17" font-weight="700">Protected API</text>
    <text x="400" y="340" text-anchor="middle" font-size="13">requireAuth</text>
  </g>

  <line x1="240" y1="161" x2="310" y2="161" stroke="#2d3c4e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="490" y1="161" x2="560" y2="161" stroke="#2d3c4e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M650 204 C650 245, 494 240, 440 280" fill="none" stroke="#2d3c4e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="490" y1="323" x2="750" y2="323" stroke="#2d3c4e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="612" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2d3c4e">compare token version</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2d3c4e"/>
    </marker>
  </defs>
</svg>
