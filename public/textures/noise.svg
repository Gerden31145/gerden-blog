<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect x="0" y="0" width="100%" height="100%" fill="grey" filter="url(#noise)"></rect>
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="1" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
      <feComponentTransfer>
        <feFuncR type="linear" slope="3" intercept="-1"></feFuncR>
        <feFuncG type="linear" slope="3" intercept="-1"></feFuncG>
        <feFuncB type="linear" slope="3" intercept="-1"></feFuncB>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>